<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulseChat — Real-Time Group & Direct Messaging</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Login Modal Overlay -->
  <div id="login-overlay" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <div class="logo-icon">⚡</div>
        <h2>Join PulseChat</h2>
        <p>Real-Time Group Chat &amp; Direct Messaging Engine</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="username-input">Choose a Username</label>
          <input 
            type="text" 
            id="username-input" 
            placeholder="e.g. Aarav, Priya, Rohan" 
            required 
            autocomplete="off" 
            maxlength="20"
            autofocus
          />
        </div>

        <div class="form-group">
          <label>Select Your Avatar</label>
          <div class="avatar-picker" id="avatar-picker">
            <button type="button" class="avatar-option selected" data-avatar="🦊">🦊</button>
            <button type="button" class="avatar-option" data-avatar="🐱">🐱</button>
            <button type="button" class="avatar-option" data-avatar="🐼">🐼</button>
            <button type="button" class="avatar-option" data-avatar="🦁">🦁</button>
            <button type="button" class="avatar-option" data-avatar="🚀">🚀</button>
            <button type="button" class="avatar-option" data-avatar="💻">💻</button>
            <button type="button" class="avatar-option" data-avatar="⚡">⚡</button>
            <button type="button" class="avatar-option" data-avatar="🎨">🎨</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Enter Chat</button>
      </form>
    </div>
  </div>

  <!-- Main Chat Application Container -->
  <div class="app-layout" id="app-layout">
    
    <!-- Left Navigation Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-logo">⚡</div>
        <div class="brand-info">
          <h1>PulseChat</h1>
          <span class="live-status"><span class="dot"></span> Connected</span>
        </div>
      </div>

      <!-- Current User Profile Widget -->
      <div class="user-profile-widget">
        <div class="user-avatar-badge" id="my-avatar-display">🦊</div>
        <div class="user-details">
          <span class="my-username" id="my-username-display">User</span>
          <span class="user-tag" id="my-socketid-display">Connecting...</span>
        </div>
      </div>

      <!-- Channels / Rooms Section -->
      <div class="sidebar-section">
        <div class="section-title">
          <span>CHANNELS</span>
        </div>
        <div class="channel-list" id="room-list">
          <button class="channel-item active" data-room="general">
            <span class="channel-hash">#</span> general
          </button>
          <button class="channel-item" data-room="developers">
            <span class="channel-hash">#</span> developers
          </button>
          <button class="channel-item" data-room="random">
            <span class="channel-hash">#</span> random
          </button>
        </div>

        <!-- Custom Channel Creator -->
        <form id="create-room-form" class="create-room-form">
          <div class="input-with-button">
            <span class="hash-prefix">#</span>
            <input 
              type="text" 
              id="new-room-input" 
              placeholder="new-channel" 
              maxlength="20"
              autocomplete="off"
            />
            <button type="submit" title="Create / Join Channel">+</button>
          </div>
        </form>
      </div>

      <!-- Direct Messages Section -->
      <div class="sidebar-section dm-section">
        <div class="section-title">
          <span>DIRECT MESSAGES</span>
          <span class="badge" id="total-unread-badge" style="display: none;">0</span>
        </div>
        <div class="dm-list" id="dm-list">
          <div class="empty-roster-msg">No other users online</div>
        </div>
      </div>
    </aside>

    <!-- Main Chat Workspace -->
    <main class="chat-workspace">
      
      <!-- Top Header -->
      <header class="chat-header">
        <div class="header-left">
          <button id="toggle-sidebar-btn" class="mobile-only-btn" title="Toggle Sidebar">☰</button>
          <div class="current-chat-title">
            <span class="header-icon" id="chat-header-icon">#</span>
            <h2 id="chat-header-title">general</h2>
          </div>
          <span class="chat-desc" id="chat-header-desc">Public channel for community discussions</span>
        </div>

        <div class="header-right">
          <button id="toggle-roster-btn" class="btn btn-secondary btn-sm" title="Toggle active roster">
            👥 <span id="roster-toggle-count">0 online</span>
          </button>
        </div>
      </header>

      <!-- Chat Messages Container -->
      <div class="messages-container" id="messages-container">
        <!-- Message bubbles populated dynamically via JS -->
      </div>

      <!-- Typing Indicator Area -->
      <div class="typing-indicator-bar" id="typing-indicator-bar">
        <div class="typing-bubble">
          <span class="typing-dot"></span>
          <span class="typing-dot"></span>
          <span class="typing-dot"></span>
        </div>
        <span class="typing-text" id="typing-text">Someone is typing...</span>
      </div>

      <!-- Message Input Bar -->
      <footer class="chat-footer">
        <form id="chat-form" class="chat-input-form">
          <input 
            type="text" 
            id="message-input" 
            placeholder="Message #general..." 
            autocomplete="off"
            required
          />
          <button type="submit" class="btn btn-send" id="send-btn">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
            <span>Send</span>
          </button>
        </form>
      </footer>

    </main>

    <!-- Right-Hand Active Users Roster -->
    <aside class="roster-panel" id="roster-panel">
      <div class="roster-header">
        <h3>Room Members (<span id="room-member-count">0</span>)</h3>
      </div>
      <div class="roster-users" id="room-users-list">
        <!-- Online users populated dynamically -->
      </div>
    </aside>

  </div>

  <!-- Socket.io client script served automatically by express/socket.io -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
