<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Group Chat & Messaging Engine</title>
  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- User Login Overlay / Modal -->
  <div id="login-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <div class="logo-icon">☕</div>
        <h2>Welcome to BrewChat</h2>
        <p>Real-Time Group Chat & Direct Messaging Engine</p>
      </div>
      <form id="login-form">
        <div class="form-group">
          <label for="username-input">Enter your Display Name</label>
          <input type="text" id="username-input" placeholder="e.g. Aarav, Priya, Rohan" required maxlength="25" autocomplete="off" autofocus>
        </div>
        
        <div class="form-group">
          <label>Select an Avatar</label>
          <div class="avatar-picker" id="avatar-picker">
            <button type="button" class="avatar-option selected" data-avatar="☕">☕</button>
            <button type="button" class="avatar-option" data-avatar="🦊">🦊</button>
            <button type="button" class="avatar-option" data-avatar="🚀">🚀</button>
            <button type="button" class="avatar-option" data-avatar="💻">💻</button>
            <button type="button" class="avatar-option" data-avatar="🎨">🎨</button>
            <button type="button" class="avatar-option" data-avatar="⚡">⚡</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-full">Join Chat Engine</button>
      </form>
    </div>
  </div>

  <!-- Main Chat Container -->
  <div id="app-container" class="app-layout hidden">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <span class="brand-icon">☕</span>
          <span class="brand-title">BrewChat</span>
        </div>
      </div>

      <!-- Current User Profile Card -->
      <div class="user-profile-badge">
        <div class="profile-avatar" id="current-user-avatar">☕</div>
        <div class="profile-info">
          <span class="profile-name" id="current-user-name">Guest</span>
          <span class="profile-status"><span class="status-dot"></span> Online</span>
        </div>
      </div>

      <!-- Navigation Rooms -->
      <div class="sidebar-section">
        <h3 class="section-title">Channels</h3>
        <ul class="room-list" id="room-list">
          <li class="room-item active" data-room="general">
            <span class="room-hash">#</span>
            <span class="room-name">general</span>
          </li>
          <li class="room-item" data-room="developers">
            <span class="room-hash">#</span>
            <span class="room-name">developers</span>
          </li>
          <li class="room-item" data-room="random">
            <span class="room-hash">#</span>
            <span class="room-name">random</span>
          </li>
        </ul>
      </div>

      <!-- Active Room User Roster -->
      <div class="sidebar-section roster-section">
        <div class="roster-header">
          <h3 class="section-title">Online in Room</h3>
          <span class="user-count-badge" id="roster-count">0</span>
        </div>
        <ul class="user-roster" id="user-roster">
          <!-- Dynamically populated via room:userlist -->
        </ul>
      </div>
    </aside>

    <!-- Main Chat Window Area -->
    <main class="chat-main">
      <!-- Chat Header -->
      <header class="chat-header">
        <div class="channel-info">
          <h2 class="channel-title" id="active-channel-title">#general</h2>
          <span class="channel-topic" id="active-channel-topic">General discussion & community updates</span>
        </div>
        <div class="chat-header-actions">
          <span class="connection-pill" id="connection-status">🟢 Connected</span>
        </div>
      </header>

      <!-- Message History Container -->
      <div class="messages-container" id="messages-container">
        <!-- Messages rendered dynamically here -->
      </div>

      <!-- Typing Indicator Footer Area -->
      <div class="typing-indicator-bar" id="typing-indicator-bar">
        <span class="typing-dots" id="typing-dots-container"></span>
        <span class="typing-text" id="typing-text"></span>
      </div>

      <!-- Message Composer Box -->
      <footer class="chat-composer">
        <form id="chat-form">
          <div class="composer-input-wrap">
            <input 
              type="text" 
              id="message-input" 
              placeholder="Type a message in #general..." 
              autocomplete="off"
            >
            <button type="submit" id="send-btn" class="btn btn-send">
              <span>Send</span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </div>
        </form>
      </footer>
    </main>
  </div>

  <!-- Direct Messaging (DM) Modal -->
  <div id="dm-modal" class="modal-overlay hidden">
    <div class="modal-card dm-card">
      <div class="dm-card-header">
        <div class="dm-user-info">
          <span class="dm-avatar" id="dm-recipient-avatar">👤</span>
          <div>
            <h3 id="dm-recipient-name">Private Conversation</h3>
            <span class="dm-socket-id" id="dm-recipient-socket">Socket ID: -</span>
          </div>
        </div>
        <button type="button" class="modal-close-btn" id="dm-close-btn">&times;</button>
      </div>
      
      <div class="dm-messages-container" id="dm-messages-container">
        <!-- DM chat bubbles -->
      </div>

      <form id="dm-form" class="dm-composer">
        <input type="text" id="dm-input" placeholder="Type a private message..." autocomplete="off" required>
        <button type="submit" class="btn btn-primary">Send DM</button>
      </form>
    </div>
  </div>

  <!-- Socket.io Client -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
